name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux GL and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libglfw3 libgl-dev libegl-dev libgl1-mesa-dri libxinerama1 libxcursor1 libxi6 libxrandr2 xvfb
      - name: Dependencies
        run: python -m pip install -r requirements-lock.txt pytest
      - name: Linux tests with software GL
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m pytest -q
